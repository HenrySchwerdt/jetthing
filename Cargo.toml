[workspace]
resolver = "3"
members = ["crates/*", "plugins/mongo-raabit/core", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
parking_lot = "0.12"
portable-pty = "0.9"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
url = { version = "2.5", features = ["serde"] }
walkdir = "2.5"


[profile.release]
lto = "thin"
codegen-units = 1
