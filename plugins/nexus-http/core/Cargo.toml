[package]
name = "nexus-http-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless engine of the nexus-http API client plugin: model, storage, templating, auth and execution."

[dependencies]
base64 = "0.22"
cookie = "0.18"
hmac = "0.12"
md-5 = "0.10"
shell-words = "1.1"
yaml_serde = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "http2", "socks", "gzip", "brotli", "deflate", "multipart", "charset"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_json_path = "0.7"
sha2 = "0.10"
thiserror.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
