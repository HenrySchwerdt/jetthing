[package]
name = "mongo-raabit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "mongo-raabit: a MongoDB GUI plugin for Jetthing (egui views over mongo-raabit-core)"

[dependencies]
jetthing-plugin-api = { path = "../../crates/jetthing-plugin-api" }
jetthing-plugin-ui = { path = "../../crates/jetthing-plugin-ui" }
mongo-raabit-core = { path = "core" }
egui.workspace = true
egui_extras = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
eframe.workspace = true
jetthing-ui = { path = "../../crates/jetthing-ui" }
