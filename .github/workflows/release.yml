name: Release

# Every push to main runs the checks. The platform builds run only when the
# workspace version in Cargo.toml has no `v<version>` tag yet (they are then
# published as a GitHub release, which the IDE's "Check for Updates" reads), on
# a tag push, or when started manually.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version will be released"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- parity --check

  build:
    name: build ${{ matrix.os }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        id: dist
        shell: bash
        run: |
          dir=$(cargo run -q -p xtask -- dist | tail -n 1)
          name=${dir#dist/}
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jetthing-${{ needs.version.outputs.version }}-${{ matrix.os }}
          path: |
            ${{ steps.dist.outputs.archive }}
            ${{ steps.dist.outputs.archive }}.sha256

  release:
    needs: [version, checks, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Jetthing ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
