name: CI

# Pull requests only: pushes to main are checked by the release workflow's
# `checks` job. Drafts are skipped, and a new push cancels the previous run of
# the same pull request, so busy branches do not queue redundant runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, parity
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- parity --check

  scenes:
    name: parity scenes (Xvfb, glow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libgl1
      # Starts its own Xvfb, replays docs/parity/scenes/*.json over the control
      # socket and asserts workbench state; the PNGs are uploaded for review.
      - run: cargo run -p xtask -- scenes --out target/scenes/out
        env:
          JETTHING_RENDERER: glow
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-scenes
          path: |
            target/scenes/out/*.png
            target/scenes/*/app.log
          if-no-files-found: warn
