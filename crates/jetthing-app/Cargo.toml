[package]
name = "jetthing-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["mongo-raabit"]
# Bundle the mongo-raabit MongoDB plugin under plugins/mongo-raabit.
mongo-raabit = ["dep:mongo-raabit"]
# Bundle the example plugin under plugins/hello (development and docs).
example-plugins = ["dep:jetthing-plugin-hello"]

[dependencies]
eframe.workspace = true
jetthing-plugin-hello = { path = "../../plugins/hello", optional = true }
jetthing-plugin-lua = { path = "../jetthing-plugin-lua" }
jetthing-plugin-wasm = { path = "../jetthing-plugin-wasm" }
jetthing-ui = { path = "../jetthing-ui" }
mongo-raabit = { path = "../../plugins/mongo-raabit", optional = true }
