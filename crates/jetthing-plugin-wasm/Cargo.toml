[package]
name = "jetthing-plugin-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly component plugin runtime for Jetthing (wasmtime + WIT), with declared permissions."

[dependencies]
jetthing-plugin-api = { path = "../jetthing-plugin-api" }
jetthing-plugin-ui = { path = "../jetthing-plugin-ui" }
jetthing-plugins = { path = "../jetthing-plugins" }
serde_json.workspace = true
wasmtime = { version = "49", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "addr2line"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

[dev-dependencies]
egui.workspace = true
